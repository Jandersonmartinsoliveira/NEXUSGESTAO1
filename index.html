<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus Gestão — ERP</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#111827;--muted:#667085;--line:#e5e7eb;--brand:#111827;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--orange:#d97706}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}
button{cursor:pointer}.layout{display:flex;min-height:100vh}.side{position:fixed;z-index:5;inset:0 auto 0 0;width:245px;background:var(--brand);color:#fff;padding:18px 12px;overflow:auto}.logo{font-weight:900;font-size:23px;padding:9px 10px 22px}.logo small{display:block;color:#9ca3af;font-size:10px;letter-spacing:1px;margin-top:2px}.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#d1d5db;text-align:left;padding:10px 12px;border-radius:9px;margin:2px 0}.nav button:hover,.nav button.on{background:#263244;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:22px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.top h1{margin:0;font-size:25px}.top-right{display:flex;gap:8px;align-items:center}.avatar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--muted)}
.grid{display:grid;gap:15px}.kpis{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:2fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 2px 8px #00000008}.kpi .label{color:var(--muted);font-size:12px}.kpi .value{font-weight:850;font-size:25px;margin-top:5px}.kpi .sub{font-size:11px;color:var(--muted);margin-top:4px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:13px}.head h2{font-size:17px;margin:0}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.ok{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{background:var(--red);border-color:var(--red);color:#fff}.btn.small{padding:5px 8px;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.toolbar input{width:260px}.input,.select,.textarea,.toolbar input{border:1px solid #d1d5db;border-radius:8px;padding:9px;background:#fff;outline:none}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:10px;color:var(--muted);text-transform:uppercase}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;background:#eef2ff;color:#3730a3}.badge.ok{background:#dcfce7;color:#166534}.badge.warn{background:#fef3c7;color:#92400e}.badge.bad{background:#fee2e2;color:#991b1b}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{width:100%}.actions{display:flex;gap:7px;flex-wrap:wrap}.notice{padding:10px 12px;border-radius:9px;background:#eff6ff;color:#1e40af;font-size:12px;margin-bottom:13px}.empty{text-align:center;padding:28px;color:var(--muted)}.chart{height:210px;display:flex;gap:8px;align-items:flex-end;padding:15px 2px 25px}.bar{flex:1;background:#2563eb;border-radius:5px 5px 1px 1px;min-height:4px;position:relative}.bar i{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9px;color:var(--muted)}.bar em{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:9px;font-style:normal;white-space:nowrap}.modal{position:fixed;inset:0;background:#0008;display:none;z-index:30;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modalbox{width:min(820px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:15px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalhead h2{margin:0;font-size:18px}.login{min-height:100vh;display:grid;place-items:center;background:#111827}.loginbox{width:min(410px,92%);background:#fff;padding:28px;border-radius:17px}.loginbox h1{margin:0}.loginbox p{color:var(--muted)}.loginbox .field{margin:10px 0}.loginbox button{width:100%}.hide{display:none!important}
@media(max-width:950px){.side{width:70px}.logo{font-size:0;text-align:center}.logo:first-letter{font-size:22px}.logo small,.nav span{display:none}.nav button{justify-content:center}.main{margin-left:70px;width:calc(100% - 70px)}.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:650px){.main{padding:13px}.top h1{font-size:20px}.kpis,.three{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar input{width:100%}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle"></h2><button class="btn" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const API=localStorage.getItem('NEXUS_API')||'http://localhost:3333';
let token=localStorage.getItem('NEXUS_TOKEN')||'', me=null, page='dashboard', cache={products:[],customers:[],suppliers:[],sales:[],finance:[],users:[]}, cart=[];

const brl=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const api=async(path,opt={})=>{opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch(API+path,opt);let j=r.status===204?null:await r.json().catch(()=>({}));if(!r.ok)throw new Error(j?.error||'Erro na API');return j};
function nav(p,ico,label){return `<button class="${page===p?'on':''}" onclick="go('${p}')"><b>${ico}</b><span>${label}</span></button>`}
function shell(body){return `<div class="layout"><aside class="side"><div class="logo">NEXUS<small>GESTÃO ERP</small></div><div class="nav">
${nav('dashboard','▦','Dashboard')}${nav('pdv','🛒','PDV')}${nav('sales','▤','Vendas')}${nav('purchases','↙','Compras')}${nav('products','▦','Produtos')}${nav('stock','◈','Estoque')}${nav('customers','♙','Clientes')}${nav('suppliers','♧','Fornecedores')}${nav('finance','R$','Financeiro')}${nav('reports','▥','Relatórios')}${nav('users','⚙','Usuários')}${nav('settings','⚙','Configurações')}</div></aside><main class="main"><div class="top"><h1>${titles[page]}</h1><div class="top-right"><div class="avatar">${esc(me?.user?.name||'Usuário')} · ${esc(me?.user?.role||'')}</div><button class="btn" onclick="logout()">Sair</button></div></div>${body}</main></div>`}
const titles={dashboard:'Dashboard',pdv:'PDV / Nova venda',sales:'Vendas',purchases:'Compras',products:'Produtos',stock:'Estoque',customers:'Clientes',suppliers:'Fornecedores',finance:'Financeiro',reports:'Relatórios',users:'Usuários',settings:'Configurações'};

async function start(){if(!token){renderLogin();return}try{me=await api('/api/me');await loadCache();render()}catch(e){token='';localStorage.removeItem('NEXUS_TOKEN');renderLogin()}}
async function loadCache(){let arr=await Promise.all(['/api/products','/api/customers','/api/suppliers','/api/sales','/api/finance'].map(x=>api(x)));[cache.products,cache.customers,cache.suppliers,cache.sales,cache.finance]=arr;if(me.user.role==='ADMIN')cache.users=await api('/api/users')}
function renderLogin(){document.getElementById('root').innerHTML=`<div class="login"><div class="loginbox"><h1>Nexus Gestão</h1><p>ERP SaaS integrado</p><div class="field"><label>E-mail</label><input id="lemail" class="input" value="admin@empresa.com"></div><div class="field"><label>Senha</label><input id="lpass" type="password" class="input"></div><button class="btn primary" onclick="login()">Entrar</button><div class="notice" style="margin-top:12px">Configure a URL da API em localStorage com <b>NEXUS_API</b> se o backend estiver em outro endereço.</div></div></div>`}
async function login(){try{let j=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:lemail.value,password:lpass.value})});token=j.token;localStorage.setItem('NEXUS_TOKEN',token);await start()}catch(e){alert(e.message)}}
function logout(){token='';localStorage.removeItem('NEXUS_TOKEN');renderLogin()}
async function go(p){page=p;try{await loadCache()}catch{}render()}
function render(){document.getElementById('root').innerHTML=shell(content())}
function content(){return ({dashboard:dashboard,pdv:pdv,sales:sales,purchases:purchases,products:products,stock:stock,customers:customers,suppliers:suppliers,finance:finance,reports:reports,users:users,settings:settings}[page])()}

async function dashboard(){return ''} // replaced asynchronously below
function dashboardBody(d){let months=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];let vals=months.map(()=>0);cache.sales.forEach(s=>{let m=new Date(s.createdAt).getMonth();vals[m]+=Number(s.total)});let mx=Math.max(...vals,1);let low=cache.products.filter(p=>p.stock<=p.minStock);return `<div class="grid kpis"><div class="card kpi"><div class="label">Faturamento</div><div class="value">${brl(d.revenue)}</div><div class="sub">${cache.sales.length} venda(s)</div></div><div class="card kpi"><div class="label">Entradas</div><div class="value">${brl(d.entries)}</div></div><div class="card kpi"><div class="label">Saídas</div><div class="value">${brl(d.exits)}</div></div><div class="card kpi"><div class="label">Saldo</div><div class="value">${brl(d.balance)}</div><div class="sub">${d.lowStock} item(ns) com estoque baixo</div></div></div><div class="grid two" style="margin-top:15px"><div class="card"><div class="head"><h2>Faturamento por mês</h2></div><div class="chart">${vals.map((v,i)=>`<div class="bar" style="height:${Math.max(4,v/mx*170)}px"><em>${v?brl(v):''}</em><i>${months[i]}</i></div>`).join('')}</div></div><div class="card"><div class="head"><h2>Ações rápidas</h2></div><div class="actions"><button class="btn primary" onclick="go('pdv')">Nova venda</button><button class="btn" onclick="modalProduct()">Novo produto</button><button class="btn" onclick="modalFinance()">Lançar financeiro</button><button class="btn" onclick="modalPurchase()">Nova compra</button></div></div></div><div class="card" style="margin-top:15px"><div class="head"><h2>Estoque baixo</h2></div>${low.length?`<table class="table"><tr><th>Produto</th><th>Estoque</th><th>Mínimo</th></tr>${low.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.stock}</td><td>${p.minStock}</td></tr>`).join('')}</table>`:'<div class="empty">Nenhum item abaixo do mínimo.</div>'}</div>`}

async function refreshDashboard(){let d=await api('/api/dashboard');document.getElementById('root').innerHTML=shell(dashboardBody(d))}
function dashboardSync(){refreshDashboard().catch(e=>alert(e.message))}
function dashboard(){return `<div class="notice">Carregando indicadores...</div><script>setTimeout(dashboardSync,0)<\/script>`}

function pdv(){let total=cart.reduce((a,x)=>a+x.qty*x.unitPrice,0);return `<div class="grid two"><div class="card"><div class="head"><h2>Produtos</h2></div><div class="toolbar"><input class="input" id="pdvQ" placeholder="Nome ou SKU" oninput="filterPDV()"></div><div id="pdvList">${pdvRows()}</div></div><div class="card"><div class="head"><h2>Carrinho</h2><span class="badge">${cart.length} item(ns)</span></div>${cart.length?`<table class="table">${cart.map((x,i)=>`<tr><td>${esc(x.name)}<br><small>${x.qty} × ${brl(x.unitPrice)}</small></td><td>${brl(x.qty*x.unitPrice)}</td><td><button class="btn small" onclick="cart.splice(${i},1);go('pdv')">×</button></td></tr>`).join('')}</table><h2 style="display:flex;justify-content:space-between">Total <span>${brl(total)}</span></h2><div class="form"><div class="field"><label>Cliente</label><select id="saleCustomer" class="select"><option value="">Consumidor</option>${cache.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Pagamento</label><select id="salePayment" class="select"><option>PIX</option><option>Cartão</option><option>Dinheiro</option><option>Boleto</option></select></div></div><button class="btn ok" style="width:100%;margin-top:12px" onclick="finishSale()">Finalizar venda</button>`:'<div class="empty">Carrinho vazio.</div>'}</div></div>`}
function pdvRows(){return cache.products.map(p=>`<div class="card" style="padding:11px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center"><div><b>${esc(p.name)}</b><div style="font-size:11px;color:var(--muted)">${esc(p.sku)} · estoque ${p.stock}</div></div><div>${brl(p.price)} <button class="btn primary small" ${p.stock<1?'disabled':''} onclick="addCart('${p.id}')">Adicionar</button></div></div>`).join('')||'<div class="empty">Nenhum produto.</div>'}
function filterPDV(){let q=String(pdvQ.value).toLowerCase();pdvList.innerHTML=cache.products.filter(p=>(p.name+p.sku).toLowerCase().includes(q)).map(p=>`<div class="card" style="padding:11px;margin-bottom:7px;display:flex;justify-content:space-between"><div><b>${esc(p.name)}</b><div>${esc(p.sku)} · ${p.stock} un.</div></div><div>${brl(p.price)} <button class="btn primary small" onclick="addCart('${p.id}')">Adicionar</button></div></div>`).join('')||'<div class="empty">Nenhum resultado.</div>'}
function addCart(pid){let p=cache.products.find(x=>x.id===pid),x=cart.find(x=>x.productId===pid);if(!p||p.stock<1)return alert('Sem estoque.');if(x){if(x.qty>=p.stock)return alert('Quantidade acima do estoque.');x.qty++}else cart.push({productId:p.id,name:p.name,qty:1,unitPrice:Number(p.price)});go('pdv')}
async function finishSale(){try{await api('/api/sales',{method:'POST',body:JSON.stringify({customerId:saleCustomer.value||undefined,payment:salePayment.value,items:cart.map(x=>({productId:x.productId,qty:x.qty,unitPrice:x.unitPrice}))})});cart=[];alert('Venda registrada.');go('sales')}catch(e){alert(e.message)}}

function sales(){return `<div class="card"><div class="toolbar"><input class="input" placeholder="Pesquisar" oninput="filterRows('saleTable',this.value)"><button class="btn primary" onclick="go('pdv')">+ Nova venda</button></div><table class="table" id="saleTable"><tr><th>ID</th><th>Data</th><th>Cliente</th><th>Pagamento</th><th>Total</th></tr>${cache.sales.map(s=>`<tr><td>${esc(s.id.slice(-8))}</td><td>${new Date(s.createdAt).toLocaleString('pt-BR')}</td><td>${esc(s.customer?.name||'Consumidor')}</td><td>${esc(s.payment)}</td><td>${brl(s.total)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhuma venda.</td></tr>'}</table></div>`}

function purchases(){return `<div class="card"><div class="toolbar"><button class="btn primary" onclick="modalPurchase()">+ Receber compra</button></div><table class="table"><tr><th>ID</th><th>Data</th><th>Fornecedor</th><th>Total</th><th>Status</th></tr><tbody id="purchaseRows"><tr><td colspan="5" class="empty">Carregando...</td></tr></tbody></table></div><script>setTimeout(loadPurchases,0)<\/script>`}
async function loadPurchases(){try{let a=await api('/api/purchases');document.getElementById('purchaseRows').innerHTML=a.map(x=>`<tr><td>${esc(x.id.slice(-8))}</td><td>${new Date(x.createdAt).toLocaleString('pt-BR')}</td><td>${esc(x.supplier?.name||'—')}</td><td>${brl(x.total)}</td><td><span class="badge ok">${esc(x.status)}</span></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhuma compra.</td></tr>'}catch(e){document.getElementById('purchaseRows').innerHTML='<tr><td colspan="5" class="empty">'+esc(e.message)+'</td></tr>'}}

function products(){return `<div class="card"><div class="toolbar"><input class="input" placeholder="Pesquisar produto" oninput="filterRows('prodTable',this.value)"><button class="btn primary" onclick="modalProduct()">+ Produto</button></div><table class="table" id="prodTable"><tr><th>SKU</th><th>Produto</th><th>Categoria</th><th>Custo</th><th>Venda</th><th>Estoque</th><th>Ações</th></tr>${cache.products.map(p=>`<tr><td>${esc(p.sku)}</td><td>${esc(p.name)}</td><td>${esc(p.category||'—')}</td><td>${brl(p.cost)}</td><td>${brl(p.price)}</td><td><span class="badge ${p.stock<=p.minStock?'warn':'ok'}">${p.stock}</span></td><td><button class="btn small" onclick="modalProduct('${p.id}')">Editar</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nenhum produto.</td></tr>'}</table></div>`}
function stock(){let value=cache.products.reduce((a,p)=>a+Number(p.cost)*p.stock,0),low=cache.products.filter(p=>p.stock<=p.minStock);return `<div class="grid kpis"><div class="card kpi"><div class="label">Valor de custo</div><div class="value">${brl(value)}</div></div><div class="card kpi"><div class="label">Produtos</div><div class="value">${cache.products.length}</div></div><div class="card kpi"><div class="label">Estoque baixo</div><div class="value">${low.length}</div></div><div class="card kpi"><div class="label">Unidades</div><div class="value">${cache.products.reduce((a,p)=>a+p.stock,0)}</div></div></div><div class="card" style="margin-top:15px"><div class="head"><h2>Estoque</h2><button class="btn primary" onclick="modalStock()">Entrada de mercadoria</button></div><table class="table"><tr><th>SKU</th><th>Produto</th><th>Saldo</th><th>Mínimo</th><th>Status</th></tr>${cache.products.map(p=>`<tr><td>${esc(p.sku)}</td><td>${esc(p.name)}</td><td>${p.stock}</td><td>${p.minStock}</td><td>${p.stock<=p.minStock?'<span class="badge warn">Reposição</span>':'<span class="badge ok">Normal</span>'}</td></tr>`).join('')}</table></div>`}
function customers(){return simpleTable('Clientes','customers',['name','document','phone','email'], 'modalCustomer')}
function suppliers(){return simpleTable('Fornecedores','suppliers',['name','document','phone','email'], 'modalSupplier')}
function simpleTable(title,key,fields,fn){return `<div class="card"><div class="toolbar"><input class="input" placeholder="Pesquisar" oninput="filterRows('${key}Table',this.value)"><button class="btn primary" onclick="${fn}()">+ Cadastrar</button></div><table class="table" id="${key}Table"><tr>${fields.map(f=>`<th>${fieldLabel(f)}</th>`).join('')}</tr>${cache[key].map(x=>`<tr>${fields.map(f=>`<td>${esc(x[f]||'—')}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${fields.length}" class="empty">Nenhum registro.</td></tr>`}</table></div>`}
function fieldLabel(x){return ({name:'Nome',document:'CPF/CNPJ',phone:'Telefone',email:'E-mail'})[x]||x}
function finance(){let en=cache.finance.filter(x=>x.type==='entrada').reduce((a,x)=>a+Number(x.value),0),sa=cache.finance.filter(x=>x.type==='saida').reduce((a,x)=>a+Number(x.value),0);return `<div class="grid kpis"><div class="card kpi"><div class="label">Entradas</div><div class="value">${brl(en)}</div></div><div class="card kpi"><div class="label">Saídas</div><div class="value">${brl(sa)}</div></div><div class="card kpi"><div class="label">Saldo</div><div class="value">${brl(en-sa)}</div></div><div class="card kpi"><div class="label">Lançamentos</div><div class="value">${cache.finance.length}</div></div></div><div class="card" style="margin-top:15px"><div class="head"><h2>Movimentações</h2><button class="btn primary" onclick="modalFinance()">+ Lançamento</button></div><table class="table"><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Valor</th></tr>${cache.finance.map(x=>`<tr><td>${new Date(x.createdAt).toLocaleDateString('pt-BR')}</td><td><span class="badge ${x.type==='entrada'?'ok':'bad'}">${x.type}</span></td><td>${esc(x.category)}</td><td>${esc(x.description||'')}</td><td>${brl(x.value)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhum lançamento.</td></tr>'}</table></div>`}
function reports(){let revenue=cache.sales.reduce((a,x)=>a+Number(x.total),0),units=cache.sales.flatMap(x=>x.items||[]).reduce((a,x)=>a+x.qty,0),stockValue=cache.products.reduce((a,p)=>a+Number(p.cost)*p.stock,0);return `<div class="grid three"><div class="card kpi"><div class="label">Faturamento</div><div class="value">${brl(revenue)}</div></div><div class="card kpi"><div class="label">Unidades vendidas</div><div class="value">${units}</div></div><div class="card kpi"><div class="label">Capital em estoque</div><div class="value">${brl(stockValue)}</div></div></div><div class="grid two" style="margin-top:15px"><div class="card"><h2>Indicadores</h2><p>Ticket médio: <b>${brl(cache.sales.length?revenue/cache.sales.length:0)}</b></p><p>Clientes cadastrados: <b>${cache.customers.length}</b></p><p>Fornecedores cadastrados: <b>${cache.suppliers.length}</b></p><p>Produtos ativos: <b>${cache.products.length}</b></p></div><div class="card"><h2>Margem estimada</h2><p>Receita: <b>${brl(revenue)}</b></p><p>Custo estimado: <b>${brl(cache.sales.flatMap(s=>s.items||[]).reduce((a,i)=>{let p=cache.products.find(p=>p.id===i.productId);return a+(p?Number(p.cost)*i.qty:0)},0))}</b></p></div></div>`}
function users(){if(me.user.role!=='ADMIN')return `<div class="notice">Apenas administradores podem gerenciar usuários.</div>`;return `<div class="card"><div class="toolbar"><button class="btn primary" onclick="modalUser()">+ Usuário</button></div><table class="table"><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th></tr>${cache.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${u.active?'<span class="badge ok">Ativo</span>':'<span class="badge bad">Inativo</span>'}</td></tr>`).join('')}</table></div>`}
function settings(){return `<div class="card"><h2>Empresa</h2><p><b>${esc(me.company.name)}</b></p><p>${esc(me.company.document||'Documento não informado')}</p><p>${esc(me.company.email||'')}</p><p>${esc(me.company.phone||'')}</p></div><div class="card" style="margin-top:15px"><h2>Integração</h2><p class="muted">API atual: ${esc(API)}</p><button class="btn" onclick="changeApi()">Alterar URL da API</button></div>`}
function changeApi(){let x=prompt('URL da API',API);if(x){localStorage.setItem('NEXUS_API',x.replace(/\/$/,''));location.reload()}}

function openModal(title,body){modalTitle.innerText=title;modalBody.innerHTML=body;modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}
function modalProduct(pid){let p=cache.products.find(x=>x.id===pid)||{sku:'',name:'',category:'',cost:0,price:0,stock:0,minStock:0};openModal(pid?'Editar produto':'Novo produto',`<div class="form"><div class="field"><label>SKU</label><input id="pSku" class="input" value="${esc(p.sku)}"></div><div class="field"><label>Nome</label><input id="pName" class="input" value="${esc(p.name)}"></div><div class="field"><label>Categoria</label><input id="pCat" class="input" value="${esc(p.category||'')}"></div><div class="field"><label>Custo</label><input id="pCost" class="input" type="number" step=".01" value="${p.cost}"></div><div class="field"><label>Preço</label><input id="pPrice" class="input" type="number" step=".01" value="${p.price}"></div><div class="field"><label>Estoque inicial</label><input id="pStock" class="input" type="number" value="${p.stock}"></div><div class="field"><label>Estoque mínimo</label><input id="pMin" class="input" type="number" value="${p.minStock}"></div></div><button class="btn primary" style="margin-top:13px" onclick="saveProduct('${pid||''}')">Salvar</button>`)}
async function saveProduct(pid){try{let b={sku:pSku.value,name:pName.value,category:pCat.value,cost:+pCost.value,price:+pPrice.value,stock:+pStock.value,minStock:+pMin.value};if(pid)await api('/api/products/'+pid,{method:'PATCH',body:JSON.stringify(b)});else await api('/api/products',{method:'POST',body:JSON.stringify(b)});closeModal();await loadCache();render()}catch(e){alert(e.message)}}
function modalCustomer(){openModal('Novo cliente',`<div class="form"><div class="field"><label>Nome</label><input id="cName" class="input"></div><div class="field"><label>CPF/CNPJ</label><input id="cDoc" class="input"></div><div class="field"><label>Telefone</label><input id="cPhone" class="input"></div><div class="field"><label>E-mail</label><input id="cEmail" class="input"></div><div class="field full"><label>Endereço</label><input id="cAddress" class="input"></div></div><button class="btn primary" style="margin-top:13px" onclick="saveCustomer()">Salvar</button>`)}
async function saveCustomer(){try{await api('/api/customers',{method:'POST',body:JSON.stringify({name:cName.value,document:cDoc.value,phone:cPhone.value,email:cEmail.value,address:cAddress.value})});closeModal();await loadCache();render()}catch(e){alert(e.message)}}
function modalSupplier(){openModal('Novo fornecedor',`<div class="form"><div class="field"><label>Nome</label><input id="sName" class="input"></div><div class="field"><label>CPF/CNPJ</label><input id="sDoc" class="input"></div><div class="field"><label>Telefone</label><input id="sPhone" class="input"></div><div class="field"><label>E-mail</label><input id="sEmail" class="input"></div></div><button class="btn primary" style="margin-top:13px" onclick="saveSupplier()">Salvar</button>`)}
async function saveSupplier(){try{await api('/api/suppliers',{method:'POST',body:JSON.stringify({name:sName.value,document:sDoc.value,phone:sPhone.value,email:sEmail.value})});closeModal();await loadCache();render()}catch(e){alert(e.message)}}
function modalFinance(){openModal('Lançamento financeiro',`<div class="form"><div class="field"><label>Tipo</label><select id="fType" class="select"><option value="entrada">Entrada</option><option value="saida">Saída</option></select></div><div class="field"><label>Valor</label><input id="fValue" class="input" type="number" step=".01"></div><div class="field"><label>Categoria</label><input id="fCat" class="input"></div><div class="field"><label>Descrição</label><input id="fDesc" class="input"></div></div><button class="btn primary" style="margin-top:13px" onclick="saveFinance()">Salvar</button>`)}
async function saveFinance(){try{await api('/api/finance',{method:'POST',body:JSON.stringify({type:fType.value,value:+fValue.value,category:fCat.value||'Geral',description:fDesc.value})});closeModal();await loadCache();render()}catch(e){alert(e.message)}}
function modalStock(){openModal('Entrada de mercadoria',`<div class="form"><div class="field"><label>Produto</label><select id="stProd" class="select">${cache.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Quantidade</label><input id="stQty" class="input" type="number" min="1" value="1"></div></div><p class="notice">A entrada direta precisa de endpoint de recebimento no backend. Nesta versão, a compra é registrada pelo módulo de compras e deve ser implementada no próximo endpoint transacional.</p><button class="btn" onclick="closeModal()">Fechar</button>`)}
function modalPurchase(){openModal('Receber compra',`<div class="form"><div class="field"><label>Fornecedor</label><select class="select" id="puSupplier">${cache.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Produto</label><select class="select" id="puProduct">${cache.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Quantidade</label><input class="input" id="puQty" type="number" min="1" value="1"></div><div class="field"><label>Custo unitário</label><input class="input" id="puCost" type="number" step=".01"></div></div><button class="btn primary" style="margin-top:13px" onclick="savePurchase()">Receber e atualizar estoque</button>`)}
async function savePurchase(){try{await api('/api/purchases',{method:'POST',body:JSON.stringify({supplierId:puSupplier.value||undefined,items:[{productId:puProduct.value,qty:+puQty.value,unitCost:+puCost.value}]})});closeModal();await loadCache();render()}catch(e){alert(e.message)}}
function modalUser(){openModal('Novo usuário',`<div class="form"><div class="field"><label>Nome</label><input id="uName" class="input"></div><div class="field"><label>E-mail</label><input id="uEmail" class="input"></div><div class="field"><label>Senha inicial</label><input id="uPass" class="input" type="password"></div><div class="field"><label>Perfil</label><select id="uRole" class="select"><option>VENDEDOR</option><option>GERENTE</option><option>FINANCEIRO</option><option>ESTOQUE</option><option>ADMIN</option></select></div></div><p class="notice">O endpoint de criação de usuários será usado na próxima etapa de administração.</p><button class="btn" onclick="closeModal()">Fechar</button>`)}
function filterRows(id,q){q=q.toLowerCase();document.querySelectorAll('#'+id+' tr').forEach((r,i)=>{if(i===0)return;r.style.display=r.innerText.toLowerCase().includes(q)?'':'none'})}
start();
</script>
</body>
</html>
